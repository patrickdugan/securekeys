[package]
name = "wgc-capture"
version = "0.1.0"
edition = "2021"
description = "Verification harness: does WDA_EXCLUDEFROMCAPTURE block Windows.Graphics.Capture (the modern recorder path)?"

[[bin]]
name = "wgc-capture"
path = "src/main.rs"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_Com",
]
